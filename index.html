<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تواصل معنا عبر واتساب</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.card {
    width: 90%;
    max-width: 420px;
    background: #fff;
    border-radius: 25px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.whatsapp-icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
}

h1 {
    color: #222;
    margin-bottom: 12px;
}

p {
    color: #666;
    font-size: 16px;
    margin-bottom: 25px;
    line-height: 1.7;
}

.phone {
    direction: ltr;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 25px;
    color: #333;
}

.whatsapp-button {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: #25D366;
    color: white;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
    transition: 0.3s;
}

.whatsapp-button:hover {
    background: #1ebe5d;
    transform: translateY(-2px);
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #999;
    line-height: 1.8;
}

.programmer {
    margin-top: 8px;
    color: #333;
    font-size: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <div class="whatsapp-icon">
        💬
    </div>

    <h1>تواصل معنا</h1>

    <p>
        يمكنك التواصل معنا مباشرة عبر تطبيق واتساب
    </p>

    <div class="phone">
        0786 414 9641
    </div>

    <a class="whatsapp-button"
       href="https://wa.me/9647864149641"
       target="_blank">
        💬 تواصل عبر واتساب
    </a>

    <div class="footer">
        متوفر للتواصل عبر واتساب

        <div class="programmer">
            👨‍💻 المبرمج: السيد محمد المولى
        </div>
    </div>

</div>

</body>
</html>
